    <div class="container">

        <h1 class="text-center">Add subcategory form</h1>

        <div class="row">
            <div class="col-6 mx-auto">

                <form>

                    <div class="form-group">
                        <label for="name">Subcategory name</label>
                        <input type="text"
                               class="form-control"
                               id="name"
                               name="name">
                    </div>

                    <div class="form-group">
                        <label for="parent_id">Main category</label>

                        <select class="form-control"
                                id="parent_id"
                                name="parent_id">

                            <option value="" selected>Not Selected</option>
                            <option value="1">Dogs Food</option>
                            <option value="2">Cats Food</option>
                            <option value="3">Fish Food</option>

                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Add
                    </button>

                    <a href="categories.html" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
